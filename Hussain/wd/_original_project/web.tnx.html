<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hire Me - Akash Devganiya</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #ffffff, #c2f0ff, #ffffff);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .message-box {
      background-color: white;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 500px;
      width: 90%;
    }

    .message-box h1 {
      font-size: 28px;
      color: #000000;
      margin-bottom: 20px;
    }

    .message-box p {
      font-size: 18px;
      color: #333;
    }

    .message-box a {
      display: inline-block;
      margin-top: 25px;
      padding: 12px 30px;
      background-color: #000000;
      color: rgb(255, 255, 255);
      text-decoration: none;
      border-radius: 25px;
      font-weight: bold;
      transition: 0.3s ease;
    }

    .message-box a:hover {
      background-color: #00c3ff;
      color: white;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="message-box">
    <h1>✅ Your record was saved successfully! I'll contact you very soon.</h1>
    <a href="website.html">Back to Home</a>
  </div>
</body>
</html>
