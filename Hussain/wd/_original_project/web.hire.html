<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hire Me - Akash Devganiya</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #ffffff, #c2f0ff, #ffffff);
      margin: 0;
      padding: 0;
    }

    .form-container {
      max-width: 600px;
      margin: 100px auto;
      padding: 40px;
      background-color: #f9f9f9;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      background-color: #000000;
      color: rgb(255, 255, 255);
      padding: 12px 25px;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s ease;
      display: block;
      margin: auto;
    }

    button:hover {
      background-color: #00c3ff;
      color: white;
      transform: scale(1.05);
    }

    @media (max-width: 600px) {
      .form-container {
        margin: 40px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="form-container">
    <a href="website.html">Back</a>
    <h2>Hire Me</h2>
   <form action="web.tnx.html" method="get">
      <label for="name">Your Name:</label>
      <input type="text" id="name" name="name" required />

      <label for="email">Your Email:</label>
      <input type="email" id="email" name="email" required />

      <label for="message">Your Message:</label>
      <textarea id="message" name="message" rows="6" required></textarea>

      <button type="submit">Submit</button>
     
    </form>
  </div>
</body> 
</html>
